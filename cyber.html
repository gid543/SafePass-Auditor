<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePass Auditor 🔐</title>
  <style>
    body {
      background: radial-gradient(circle at top, #101820, #05080d);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }

    .container {
      background: #161b22;
      border-radius: 16px;
      padding: 30px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 100, 0.1);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h1 {
      color: #00e676;
      font-size: 1.8em;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #bbb;
      font-size: 0.9em;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #0f141a;
      color: #00e676;
      text-align: center;
    }

    button {
      background: #00e676;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover {
      background: #00c853;
    }

    .strength-meter {
      height: 12px;
      width: 100%;
      background: #2a2a2a;
      border-radius: 6px;
      margin-top: 25px;
      overflow: hidden;
      transition: background 0.3s;
    }

    #strengthText, #breachText {
      margin-top: 10px;
      font-size: 0.9em;
      font-weight: 500;
    }

    footer {
      position: fixed;
      bottom: 10px;
      text-align: center;
      font-size: 0.8em;
      color: #777;
    }

    footer span {
      color: #00e676;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔐 SafePass Auditor</h1>
    <p class="subtitle">Check your password’s strength & exposure risk</p>

    <input type="password" id="password" placeholder="Enter your password">
    <button id="checkBtn">Check Password</button>

    <div class="strength-meter" id="strengthMeter"></div>
    <p id="strengthText"></p>
    <p id="breachText"></p>
  </div>

  <footer>
    <p>Built with ❤️ by <span>Sylvia Mwangi</span> | Cybersecurity Learning Project</p>
  </footer>

  <script>
    const passwordInput = document.getElementById('password');
    const checkBtn = document.getElementById('checkBtn');
    const strengthMeter = document.getElementById('strengthMeter');
    const strengthText = document.getElementById('strengthText');
    const breachText = document.getElementById('breachText');

    checkBtn.addEventListener('click', async () => {
      const password = passwordInput.value.trim();
      if (!password) {
        alert('Please enter a password!');
        return;
      }

      const strengthScore = checkStrength(password);
      displayStrength(strengthScore);

      breachText.innerHTML = '🔍 Checking breach database...';
      breachText.style.color = '#ffea00';

      const breaches = await checkBreach(password);
      if (breaches > 0) {
        breachText.innerHTML = `⚠️ Found in <strong>${breaches.toLocaleString()}</strong> known breaches!`;
        breachText.style.color = '#ff1744';
      } else {
        breachText.innerHTML = `✅ Not found in any known data breaches.`;
        breachText.style.color = '#00e676';
      }
    });

    function checkStrength(password) {
      let score = 0;
      if (password.length >= 8) score++;
      if (password.match(/[A-Z]/)) score++;
      if (password.match(/[a-z]/)) score++;
      if (password.match(/[0-9]/)) score++;
      if (password.match(/[^A-Za-z0-9]/)) score++;
      return score;
    }

    function displayStrength(score) {
      const colors = ['#ff1744', '#ff9100', '#ffea00', '#76ff03', '#00e676'];
      const texts = ['Very Weak', 'Weak', 'Moderate', 'Strong', 'Very Strong'];
      strengthMeter.style.width = (score * 20) + '%';
      strengthMeter.style.background = colors[score - 1] || '#ff1744';
      strengthText.textContent = `Strength: ${texts[score - 1] || 'Too short'}`;
    }

    async function sha1(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-1', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    async function checkBreach(password) {
      const hash = await sha1(password);
      const prefix = hash.slice(0, 5);
      const suffix = hash.slice(5);

      const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
      const text = await response.text();
      const lines = text.split('\n');

      for (const line of lines) {
        const [hashSuffix, count] = line.split(':');
        if (hashSuffix === suffix) {
          return parseInt(count);
        }
      }
      return 0;
    }
  </script>

</body>
</html>
